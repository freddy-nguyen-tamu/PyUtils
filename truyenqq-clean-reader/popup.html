<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reader speed</title>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #151515;
      color: #f3f3f3;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 76px;
      gap: 10px;
      align-items: center;
    }
    input[type="range"] {
      width: 100%;
    }
    input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 7px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #222;
      color: #fff;
    }
    .hint {
      margin-top: 10px;
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <label for="rate">Scroll rate (pixels/second)</label>
  <div class="row">
    <input id="rate" type="range" min="20" max="1200" step="10">
    <input id="number" type="number" min="1" max="5000" step="10">
  </div>
  <div class="hint">Enter toggles auto-scroll on the reader page. The setting is remembered across chapters.</div>
  <script src="popup.js"></script>
</body>
</html>
