<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Clean Manga Auto Reader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Clean Manga Reader</h1>

    <label for="speed">Auto-scroll speed</label>
    <div class="speed-row">
      <input id="speed" type="range" min="10" max="300" step="5">
      <output id="speedValue" for="speed"></output>
    </div>

    <div class="keys">
      <div><kbd>Enter</kbd><span>Auto-scroll on / off</span></div>
      <div><kbd>↑</kbd><span>Scroll up</span></div>
      <div><kbd>↓</kbd><span>Scroll down</span></div>
      <div><kbd>←</kbd><span>Previous chapter</span></div>
      <div><kbd>→</kbd><span>Next chapter</span></div>
    </div>

    <p class="note">Mouse wheel and trackpad scrolling remain native.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
