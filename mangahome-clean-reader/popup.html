<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MangaHome Clean Reader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Clean Reader</h1>

    <label for="speed">Auto-scroll speed</label>
    <div class="speed-row">
      <input id="speed" type="range" min="10" max="1000" step="10">
      <input id="speedNumber" type="number" min="10" max="5000" step="10" inputmode="numeric">
      <span>px/s</span>
    </div>

    <p>Enter toggles auto-scroll. Hold ↑/↓ to move at the same configured rate. ←/→ changes chapter.</p>
    <p class="native">Mouse wheel/touchpad scrolling stays browser-native.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
