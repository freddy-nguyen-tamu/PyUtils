<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>TikTok URL Exporter</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    h1 {
      font-size: 16px;
      margin: 0 0 10px;
    }

    button {
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      background: #fe2c55;
      color: white;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #status {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .hint {
      margin-top: 10px;
      color: #bbb;
      font-size: 12px;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <h1>TikTok Profile URL Exporter</h1>
  <button id="runBtn">Scroll, collect, download</button>
  <div id="status">Open a TikTok profile page, then click the button.</div>
  <div class="hint">Output filename: Downloads/py/ndhang.txt</div>
  <script src="popup.js"></script>
</body>
</html>
