<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MangaDex Clean Reader</title>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      font: 14px/1.4 system-ui, sans-serif;
      background: #181818;
      color: #f4f4f4;
    }
    label { display: block; font-weight: 600; margin-bottom: 10px; }
    input[type="range"] { width: 100%; }
    #value { margin-top: 8px; opacity: .8; }
    .hint { margin-top: 14px; opacity: .68; font-size: 12px; }
  </style>
</head>
<body>
  <label for="speed">Scroll speed</label>
  <input id="speed" type="range" min="10" max="1000" step="10">
  <div id="value"></div>
  <div class="hint">Enter: auto-scroll on/off<br>Up/Down: manual keyboard scroll<br>Left/Right: MangaDex native navigation</div>
  <script src="popup.js"></script>
</body>
</html>
