<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>ChatGPT Lazy Bubbles</title>
  </head>
  <body>
    <main>
      <h1>ChatGPT Lazy Bubbles</h1>
      <p class="muted">Virtualizes far-away ChatGPT messages to reduce long-chat lag.</p>

      <label class="row">
        <span>Enabled</span>
        <input id="enabled" type="checkbox" />
      </label>

      <label>
        Keep newest turns fully active
        <input id="keepRecentTurns" type="number" min="2" max="80" step="1" />
      </label>

      <label>
        Viewport buffer screens
        <input id="viewportBufferScreens" type="number" min="0.5" max="10" step="0.5" />
      </label>

      <label>
        Start after this many turns
        <input id="minTurnsBeforeVirtualize" type="number" min="4" max="200" step="1" />
      </label>

      <label class="row">
        <span>Show status pill</span>
        <input id="showStatus" type="checkbox" />
      </label>

      <label class="row">
        <span>Debug logging</span>
        <input id="debug" type="checkbox" />
      </label>

      <div id="stats" class="stats">Open a ChatGPT conversation to see stats.</div>
      <button id="save">Save settings</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
