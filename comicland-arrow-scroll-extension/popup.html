<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ComicLand Arrow Scroll</title>
  <style>
    body{width:250px;margin:0;padding:16px;font:14px/1.4 system-ui,sans-serif;color:#111827;background:#fff}
    h1{font-size:16px;margin:0 0 14px}
    label{display:block;margin-bottom:6px;font-weight:600}
    input{box-sizing:border-box;width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:7px;font:inherit}
    #autoScroll{width:100%;margin-top:12px;padding:10px 12px;border:0;border-radius:8px;background:#2563eb;color:#fff;font:inherit;font-weight:700;cursor:pointer}
    #autoScroll.on{background:#dc2626}
    #status{min-height:18px;margin-top:8px;color:#16a34a;font-size:12px}
    .hint{margin:8px 0 0;color:#6b7280;font-size:12px}
  </style>
</head>
<body>
  <h1>ComicLand Arrow Scroll</h1>

  <label for="speed">Scroll speed (pixels/second)</label>
  <input id="speed" type="number" min="50" max="5000" step="50" value="700">

  <button id="autoScroll" type="button">Start Auto Scroll</button>

  <div id="status"></div>
  <p class="hint">
    The page Play/Pause button controls Auto Scroll too. Any other left-click stops it.
    Auto Scroll resets OFF on every new chapter.
  </p>

  <script src="popup.js"></script>
</body>
</html>
