<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ComicLand Arrow Scroll</title>
  <style>
    body{width:240px;margin:0;padding:16px;font:14px/1.4 system-ui,sans-serif;color:#111827;background:#fff}
    h1{font-size:16px;margin:0 0 12px}
    label{display:block;margin-bottom:6px;font-weight:600}
    input{box-sizing:border-box;width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font:inherit}
    .hint{font-size:12px;color:#6b7280;margin:10px 0 0}
    #status{min-height:18px;margin-top:8px;color:#16a34a;font-size:12px}
  </style>
</head>
<body>
  <h1>ComicLand Arrow Scroll</h1>
  <label for="speed">Scroll speed (pixels/second)</label>
  <input id="speed" type="number" min="50" max="5000" step="50" value="700">
  <div id="status"></div>
  <p class="hint">Hold ↓ to scroll down. Hold ↑ to scroll up. At the bottom, ↓ clicks Next Chapter.</p>
  <script src="popup.js"></script>
</body>
</html>
