<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TruyenQQ Clean Reader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <label for="speed">Scroll speed</label>
    <div class="speed-row">
      <input id="speed" type="range" min="10" max="1000" step="5">
      <input id="speedNumber" type="number" min="10" max="1000" step="5" inputmode="numeric">
      <span>px/s</span>
    </div>
    <p>Enter toggles auto-scroll. ↑/↓ use the same speed. ←/→ change chapter.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
